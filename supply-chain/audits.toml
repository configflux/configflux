[[audits.zmij]]
criteria = "safe-to-deploy"
version = "1.0.21"
notes = """
Reviewed under configflux-xowl.7 (priority-1: the serde_json float path). The blanket
exemption is converted to a real audit specifically because zmij is a dtolnay crate
first published Dec 2025 that sits under the most-used serialization path — recency
plus criticality warrant a documented review rather than a rubber stamp. zmij is a
double-to-string formatter (Schubfach/yy algorithm; its tests compare against ryu),
MIT, no-std / no-alloc, authored by David Tolnay (github.com/dtolnay/zmij). build.rs
reviewed: it only runs `rustc --version` to detect the compiler minor version and
emits cfg / check-cfg flags (the standard dtolnay/autocfg pattern) — no network, no fs
writes, no arbitrary exec. The crate sets #![deny(unsafe_op_in_unsafe_fn)]; its unsafe
is entirely self-contained numeric work: bounds-guaranteed lookups into internal static
tables, raw *mut u8 digit writes into a caller buffer sized by the algorithm's
max-digit bound, same-size SIMD transmutes (const _mm_set_* helpers), and EMPTY asm!
blocks used purely as optimization barriers (no memory operands, no side effects). No
FFI to external libraries and no ambient capabilities; the only optional dependency is
no-panic (dtolnay's compile-time panic-freedom checker). Clean safe-to-deploy.
"""
