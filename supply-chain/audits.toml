
# cargo-vet audits file

[[audits.alloca]]
criteria = "safe-to-deploy"
version = "0.4.0"
notes = """
Reviewed under configflux-xowl.7 (converting the blanket safe-to-deploy exemption
to a real audit; raw-alloc/pointer cluster). Purpose: mostly-safe stack allocation
via the standard alloca-trampoline pattern. The bundled C shim was read in full
(alloca.c, 15 lines): c_with_alloca(size, callback, data) allocates via a C99 VLA
(uint8_t buffer[size]) on non-MSVC or _alloca on MSVC and invokes the callback with
that stack pointer, so the memory is valid only for the callback's duration — which
the Rust API enforces through the closure boundary. build.rs only cc-compiles that
shim (no network, no codegen, no downloads). The FFI surface is one function over
the "C-unwind" ABI (the correct choice so a Rust-side panic does not cross a plain
"C" frame as UB). Rust unsafe is limited to the FFI decl, slice::from_raw_parts_mut
over the correctly-sized region, ManuallyDrop::take of the closure, and alignment
fixup in alloca<T>. Documented misuse caveats (allocating more than the thread stack
size faults; the pointer must not escape the closure) are inherent properties of
alloca, not defects. MIT, single maintainer (playXE/alloca-rs). This certification
covers supply-chain safety and the correctness/minimality of the unsafe+FFI, not
immunity to caller misuse.
"""

