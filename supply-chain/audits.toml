[[audits.quick-xml]]
criteria = "safe-to-deploy"
version = "0.40.1"
notes = "Reviewed under configflux-uonp (SPLOT corpus + .splx parser for v0.3.0 release-gate workload). Verdict: ADD as the XML envelope tokeniser for the SPLX feature-model parser in tools/gen_splot_fixtures/. The text bodies of <feature_tree> and <constraints> use indented mini-DSLs (hand-parsed); quick-xml is responsible only for the outer <feature_model>/<meta>/<feature_tree>/<constraints> wrapping. MIT licence (single, not dual — verified on the tafia/quick-xml v0.40.1 Cargo.toml). No build.rs (verified — `gh api repos/tafia/quick-xml/contents/build.rs?ref=v0.40.1` returns 404). 0 CVEs (cargo-audit clean at the time of add). Required transitive surface: only memchr 2.1+ (already in workspace lockfile at memchr 2.8.0 via other deps — verified empirically pre-add; quick-xml introduces zero new transitive crates). Optional features `encoding`, `serde`, `async-tokio` are NOT enabled (default-features=false in benchmarks/Cargo.toml). Maintainer footprint: tafia plus multi-contributor commit history (not single-maintainer). MSRV rustc 1.79 — well below the workspace floor (rustc 1.86 via rules_rust 0.68.1). Note: the original configflux-uonp brief expected the latest at v0.36.x; the 0.40.x line is current as of 2026-05-24 and a v0.36 → v0.40 bump is the standard SemVer-minor advancement (quick-xml has historically taken breaking changes across minor lines, hence the 0.40 pin rather than open-ended `0.36`). Confined to benchmarks/ + tools/gen_splot_fixtures/, which has publish=false, so the maintainer-risk surface does not reach downstream consumers."

