[[audits.sptr]]
criteria = "safe-to-deploy"
version = "0.3.2"
notes = """
Reviewed under configflux-xowl.7 (raw-alloc/pointer cluster). sptr is the strict
provenance polyfill by Aria Beingessner (Gankra); its API (addr / with_addr /
map_addr / without_provenance, expose / from_exposed) is the reference design that
was subsequently stabilized into the standard library. MIT OR Apache-2.0, no-std
(core only), ZERO dependencies, no build.rs. ~1200 lines, fully reviewed: the only
unsafe is core::mem::transmute / transmute_copy for pointer<->integer and fn-pointer
conversions, each carrying a SAFETY comment and deliberately using transmute over
casts so Miri can track provenance. No FFI, no asm, no ambient capabilities. Among
the safest crates in the ecosystem to certify.
"""

