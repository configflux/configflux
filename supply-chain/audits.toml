[[audits.hugealloc]]
criteria = "safe-to-deploy"
version = "0.1.1"
notes = """
Reviewed under configflux-xowl.7 (raw-alloc/pointer cluster). Hugepage-aware
allocator from the OxiDD project (MIT OR Apache-2.0). No build.rs, no bundled C or
asm; 263 lines, fully reviewed. It implements allocator_api2::alloc::Allocator by
delegating to the global allocator (alloc / alloc_zeroed / dealloc / realloc) and,
on unix for sufficiently large allocations, issuing a single
libc::madvise(_, _, MADV_HUGEPAGE) hint whose return value is intentionally ignored
(a hint cannot corrupt memory). Dependencies are all already trusted (allocator-api2,
sptr, libc — default-features off). The crate sets #![deny(unsafe_op_in_unsafe_fn)];
its unsafe is standard Allocator-trait-contract code plus NonNull::new_unchecked over
global-alloc results and write_bytes zeroing of grown tails — no FFI beyond the
madvise hint and no ambient authority. 0.1.1, single-project provenance (OxiDD) noted.
"""

[[audits.libsqlite3-sys]]
criteria = "safe-to-deploy"
version = "0.37.0"
notes = """
Reviewed under configflux-xowl.7 (SQLite FFI cluster reaching the native relay;
rusqlite 0.39 pins this with features=["bundled"]). Bounded audit with scope stated
explicitly. build.rs (824 lines) reviewed: with the `bundled` feature it cc-compiles
the vendored upstream SQLite amalgamation (sqlite3/sqlite3.c) and copies the
PRE-GENERATED bindgen bindings (bindgen_bundled_version.rs) into OUT_DIR; without it,
it locates a system library via pkg-config/vcpkg. It reads standard build knobs from
the environment (SQLITE_MAX_*, LIBSQLITE3_FLAGS, link prefs) and performs NO network
access and NO untrusted codegen — buildtime_bindgen (runtime bindgen) is off by
default and unused here. The Rust FFI is mechanical, pre-generated bindgen (extern "C"
declarations), not hand-written unsafe logic. The vendored sqlite3.c is the canonical
upstream SQLite amalgamation; it is trusted by ubiquity, covered by the enforced
cargo-deny advisory check, and is explicitly NOT line-audited here — the safe-to-deploy
verdict rests on rusqlite-org stewardship (multi-contributor, 0 CVEs on the sys crate),
the mechanical bindgen FFI, and the reviewed build script. The sibling sqlcipher
amalgamation is not enabled by our feature set.
"""

